<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>司命升级中 - 我们很快回来</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        overflow: hidden;
      }

      .maintenance-container {
        text-align: center;
        padding: 40px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        max-width: 600px;
        width: 90%;
        animation: fadeInUp 1s ease-out;
      }

      .maintenance-icon {
        font-size: 80px;
        margin-bottom: 30px;
        animation: bounce 2s infinite;
      }

      .maintenance-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 20px;
        background: linear-gradient(45deg, #fff, #f0f0f0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .maintenance-subtitle {
        font-size: 1.2rem;
        margin-bottom: 30px;
        opacity: 0.9;
        line-height: 1.6;
      }

      .maintenance-subtitle ul {
        text-align: left;
        margin: 0 0 0 1.5em;
        padding-left: 1em;
      }
      .maintenance-subtitle li {
        margin-bottom: 0.3em;
        text-align: left;
      }

      .progress-container {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        padding: 6px;
        margin: 30px 0;
        overflow: hidden;
      }

      .progress-bar {
        height: 8px;
        background: linear-gradient(90deg, #4facfe, #00f2fe);
        border-radius: 20px;
        animation: progress 3s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
      }

      .contact-info {
        margin-top: 40px;
        font-size: 0.95rem;
        opacity: 0.8;
      }

      .contact-info a {
        color: #4facfe;
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .contact-info a:hover {
        color: #00f2fe;
      }

      .floating-shapes {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }

      .shape {
        position: absolute;
        opacity: 0.1;
        animation: float 6s ease-in-out infinite;
      }

      .shape:nth-child(1) {
        top: 20%;
        left: 10%;
        width: 80px;
        height: 80px;
        background: white;
        border-radius: 50%;
        animation-delay: 0s;
      }

      .shape:nth-child(2) {
        top: 60%;
        right: 15%;
        width: 120px;
        height: 120px;
        background: white;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        animation-delay: 2s;
      }

      .shape:nth-child(3) {
        bottom: 20%;
        left: 20%;
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 10px;
        animation-delay: 4s;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }

      @keyframes progress {
        0% {
          width: 0%;
        }
        50% {
          width: 70%;
        }
        100% {
          width: 0%;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
        }
      }

      @media (max-width: 768px) {
        .maintenance-title {
          font-size: 2rem;
        }

        .maintenance-subtitle {
          font-size: 1rem;
        }

        .maintenance-icon {
          font-size: 60px;
        }

        .maintenance-container {
          padding: 30px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="floating-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="maintenance-container">
      <div class="maintenance-icon">🔧</div>

      <h1 class="maintenance-title">维护中</h1>

      <p class="maintenance-subtitle">司命正在进行升级测试。<br /></p>

      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>

      <p style="opacity: 0.8; margin-bottom: 20px">🚀 预计完成时间：2-4小时</p>
    </div>

    <script>
      // 添加一些动态效果
      document.addEventListener("DOMContentLoaded", function () {
        // 创建更多浮动元素
        const container = document.querySelector(".floating-shapes");

        for (let i = 0; i < 5; i++) {
          const shape = document.createElement("div");
          shape.className = "shape";
          shape.style.left = Math.random() * 100 + "%";
          shape.style.top = Math.random() * 100 + "%";
          shape.style.width = Math.random() * 40 + 20 + "px";
          shape.style.height = shape.style.width;
          shape.style.animationDelay = Math.random() * 6 + "s";
          shape.style.animationDuration = Math.random() * 4 + 4 + "s";
          container.appendChild(shape);
        }
      });
    </script>
  </body>
</html>
